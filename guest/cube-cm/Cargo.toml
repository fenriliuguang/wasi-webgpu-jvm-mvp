[package]
name = "cube-cm"
version = "0.1.0"
edition = "2021"
publish = false
description = "Experimental CM guest for slow rotating textured cube (NOT compliant wasi:webgpu)"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Keep in lockstep with guest/vector-add-cm / triangle-cm.
wit-bindgen = "0.55.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
