[package]
name = "vector-add-cm"
version = "0.1.0"
edition = "2021"
publish = false
description = "Experimental CM guest for vector-add (NOT compliant wasi:webgpu)"

[lib]
crate-type = ["cdylib"]

[dependencies]
# 0.55 matches prior guests; use cargo --ignore-rust-version on rustc 1.86 (crate MSRV 1.87).
wit-bindgen = "0.55.0"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
