org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
kotlin.code.style=official
android.useAndroidX=true

# Local publishability coordinates (experimental; no external release).
# group aligns with package root io.github.fenriliuguang.wasi.webgpu.experimental.*
wasi.webgpu.group=io.github.fenriliuguang.wasi.webgpu.experimental
wasi.webgpu.version=0.1.0-experimental

# Keep app/test APKs after connectedAndroidTest. UTP default uninstall races with
# vivo package manager / concurrent Studio runs and surfaces as "Process crashed"
# on the first instrumented test (package REPLACED mid-run).
android.injected.androidTest.leaveApksInstalledAfterRun=true
